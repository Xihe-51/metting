# ============================================================================
# coturn 最小可用配置 —— 配合后端 /api/v1/config/ice 下发的「时效凭证」
#
# 适用场景：设备与服务器**不在同一网段**、或无线 AP 开了客户端隔离，
# 导致 WebRTC 只能靠 host/srflx 候选直连失败时的中继兜底。
# 纯同网段局域网**不需要**本文件，也不需要启动 coturn。
#
# 启动：coturn -c deploy/coturn/turnserver.conf
# ============================================================================

# ---------- 监听 ----------
listening-port=3478
tls-listening-port=5349

# 对外通告地址：局域网部署填本机内网 IP（**不要**填 127.0.0.1，
# 否则客户端会拿到回环地址，中继必然连不通）；公网部署填公网 IP 或域名。
external-ip=192.168.1.5

# 多网卡时可显式指定只监听哪张网卡；留空表示监听全部网卡。
# listening-ip=192.168.1.5

# ---------- 鉴权：时效凭证（REST API 规范）----------
# use-auth-secret 打开后，coturn 不再用静态用户名/密码，
# 而是用下面的共享密钥校验后端签发的：
#   username   = "<过期时间戳>:<用户ID>"
#   credential = base64(HMAC-SHA1(static-auth-secret, username))
# 因此后端无需保存任何凭证状态，凭证即便泄漏也只在 TTL 内有效。
#
# 注意：static-auth-secret 必须与 backend/.env 的 TURN_SECRET 完全一致，
#       且只保存在服务端，绝不能下发到前端。
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=replace-with-the-same-secret-as-backend-env
realm=meeting.local

# ---------- 中继端口范围（NAT / 防火墙需放通这段 UDP）----------
min-port=49152
max-port=65535

# ---------- 安全：禁止把本机/内网地址当作中继目标 ----------
# 下面这段**默认开启**，拦截回环、链路本地、组播、广播等地址，
# 避免参会者把 coturn 当成访问本机/邻居服务的代理。
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# 下面这段**默认关闭**：RFC1918 私网地址段。
# 本系统的中继目标就是局域网里的其他设备（它们本身就在私网段），
# 在这里拦截私网段会让跨网段中继直接失效，所以只有把 coturn 暴露到公网
# 对外提供中继时才需要打开。
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255
# denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ---------- 配额：防止个别客户端耗尽中继资源 ----------
user-quota=12
total-quota=1200

# ---------- 日志 ----------
log-file=stdout
simple-log
no-cli